server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # public/_headers solo lo entiende Cloudflare Pages. Detras de nginx hay
    # que declararlos aca o la pagina sale sin ninguna cabecera de seguridad.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location = /index.html {
        # OJO: add_header dentro de un location PISA los del server, no los
        # hereda. Por eso se repiten los cuatro en cada bloque.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        # Los assets llevan hash en el nombre, se pueden cachear para siempre.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log off;
}
